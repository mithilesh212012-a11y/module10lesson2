<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOK DONATION FORM</title>
</head>
<body>
    <H1><MARK>BOOK DONATION FORM</MARK></H1>
    <form>
        <label>NAME</label>
        <input type="text" id="name"><br>
        <label>EMAIL ID</label>
        <input type="email" id="email"><br>
        <label>PHONE NUMBER</label>
        <input type="text" id="contact"><br>
        <label>DONOR ID</label>
        <input type="password" id="donorId"><br>
        <LEGEND>BOOK DETAILS</LEGEND>
        <label>CHOOSE BOOK CATEGORY</label>
        <SELECT ID="CATEGORY">
            <OPTION VALUE="SCIENCE">SCIENCE</OPTION>
            <OPTION VALUE="MATHS">MATHS</OPTION>
            <OPTION VALUE="KANNADA">KANNADA</OPTION>
            <OPTION VALUE="HINDI">HINDI</OPTION>
            <OPTION VALUE="ENGLISH">ENGLISH</OPTION>
            <OPTION VALUE="SOCIAL SCIENCE">SOCIAL SCIENCE</OPTION>
            <OPTION VALUE="COMPUTER SCIENCE">COMPUTER SCIENCE</OPTION>
            <OPTION VALUE="OTHERS">OTHERS</OPTION>
        </SELECT><BR> <BR>
        <label>SELECT BOOK CONDITION</label>
        <input type="radio" name="condition" value="NEW">NEW<BR><BR>
        <input type="radio" name="condition" value="GOOD">GOOD<br><br>
        <INPUT TYPE="RADIO" NAME="condition" VALUE="OLD">OLD<br><br>
        <label>BOOK NAME</label>
        <input type="text" id="bookName"><br>
        <label>AUTHOR NAME</label>
        <input type="text" id="authorName"><br>
        <label>BOOK PRICE</label>
        <input type="text" id="bookPrice"><br>
        <label>BOOK QUANTITY</label>
        <input type="text" id="bookQuantity"><br>
        <label>BOOK DESCRIPTION</label>
        <textarea id="bookDescription" rows="4" cols="50"></textarea><br>
        <input type="submit" value="SUBMIT">
    </form>



</body>
</html>
